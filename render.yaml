services:
  - type: web
    name: renewkart-api
    runtime: python
    rootDir: backend
    plan: starter
    region: singapore
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py seed_catalogue_snapshot && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/products/
    disk:
      name: renewkart-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: renewkart-api.onrender.com
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: renewkart-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /var/data/media
      - key: CORS_ALLOWED_ORIGINS
        value: https://renewkart-web.onrender.com,https://renewkart.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://renewkart-api.onrender.com,https://renewkart-web.onrender.com
      - key: FRONTEND_URL
        value: https://renewkart-web.onrender.com
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "1"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
  - type: web
    name: renewkart-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://renewkart-api.onrender.com/api

databases:
  - name: renewkart-db
    databaseName: renewkart
    user: renewkart
    plan: free
    region: singapore
